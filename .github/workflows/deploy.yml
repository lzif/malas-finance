name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy the current main without an empty commit — useful after
  # changing an environment variable in the Deno Deploy dashboard.
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Deliberately NOT cancel-in-progress: queued pushes run in order, so the
  # newest commit still ends up live, and no deploy is interrupted halfway.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The same gates as ci.yml. They are repeated rather than assumed: this
      # is a separate workflow, so nothing here guarantees CI already ran on
      # this commit, and the bot writes to a live ledger — a red build reaching
      # production costs more than the ~30s these take.
      - name: Format
        run: deno fmt --check src/ deno.json

      - name: Lint
        run: deno lint src/

      - name: Type-check
        run: deno task check

      - name: Test
        run: deno test src/

      # `deno deploy` is built into the runtime — Deploy Classic, and the
      # denoland/deployctl action that drove it, shut down on 2026-07-20.
      #
      # --non-interactive is not optional here: without it the CLI prompts for
      # anything it cannot infer (org, app) and a runner would hang until it
      # times out rather than failing with a usable message.
      #
      # Add `--org <name>` if this token can reach more than one organization.
      #
      # Runtime config is NOT set here — DENO_DEPLOY_TOKEN only grants the right
      # to deploy. DATABASE_URL is injected automatically by the built-in
      # Postgres. The three app secrets (GOOGLE_AI_API_KEY, TELEGRAM_BOT_TOKEN,
      # TELEGRAM_WEBHOOK_SECRET) are set once, out of band, from .env.example:
      #   deno deploy env load .env --app malas-finance
      # so they live in the app config, never in this repo or the workflow.
      - name: Deploy to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --prod --non-interactive --app malas-finance
